# Weather-year overlay: 2037 system with ERA5 2020 weather (demand held at the 2022 profile, re-dated).
# Use with:  snakemake --configfile config_TH2037_w2020.yaml ...   (applied on top of config.yaml)
run:
  name: "TH2037_w2020"
snapshots:
  start: "2020-01-01"
  end: "2021-01-01"
load_options:
  weather_year: 2020      # data/ssp2-2.6/2037/era5_2020/Asia.csv
atlite:
  cutouts:
    cutout-2020-era5-TH:
      module: era5
      dx: 0.3
      dy: 0.3
  default: cutout-2020-era5-TH
